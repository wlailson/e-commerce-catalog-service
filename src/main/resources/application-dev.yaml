spring:
  datasource:
    url: jdbc:postgresql://localhost:5480/wlailsondb
    username: wlailson
    password: wlailson
    driver-class-name: org.postgresql.Driver

  flyway:
    schemas:
      - catalog
    default-schema: catalog
    create-schemas: true


  jpa:
    show-sql: true
    properties:
      hibernate:
        default_schema: catalog
        format_sql: true
        highlight_sql: true