spring:
  application:
    name: catalog-service
  profiles:
    active:
      - ${APP_PROFILE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  public-key: ${JWT_PUBLIC_KEY}

cors:
  origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

server:
  port: ${SERVER_PORT:8080}
