spring:
  application:
    name: catalog-service
  profiles:
    active:
      - ${APP_PROFILE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  duration: ${JWT_DURATION:86400}
  refresh: ${JWT_REFRESH_DURATION:172800}
  secret: ${SECRET:sua-chave-secreta-super-segura-que-deve-ser-bem-longa}

cors:
  origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

server:
  port: ${PORT:8082}
