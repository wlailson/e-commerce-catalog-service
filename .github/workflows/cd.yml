name: CI/CD

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main

jobs:
  validate-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "Only pull requests from develop are allowed into main."
            exit 1
          fi

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Get latest Git tag
        id: version
        run: |
          TAG=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$TAG" ]; then
            echo "Nenhuma tag de versão encontrada."
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "Git tag: $TAG"
          echo "Docker version: $VERSION"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t wlailson/e-commerce-identity-service:latest \
            -t wlailson/e-commerce-identity-service:${{ steps.version.outputs.version }} \
            .

      - name: Push Docker images
        run: |
          docker push wlailson/e-commerce-identity-service:latest
          docker push wlailson/e-commerce-identity-service:${{ steps.version.outputs.version }}
